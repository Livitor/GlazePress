<!--
  导航栏组件
  特性：固定定位 + 滚动后变毛玻璃 + 居中导航 + 暗色切换 + 移动端汉堡菜单
-->
<nav id="navbar" class="navbar-glass at-top">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-full flex items-center justify-center relative">

    <!-- 居中导航链接（圆角矩形胶囊样式） -->
    <div class="hidden md:flex items-center gap-2">
      {{#each config.nav}}
      <a href="{{this.url}}" class="glass-btn text-sm font-medium px-4 py-2 rounded-lg transition-all duration-200 hover:scale-105"
         style="color: var(--text-secondary)">
        {{this.label}}
      </a>
      {{/each}}

      <!-- 分隔线 -->
      <div class="w-px h-5 mx-1" style="background: var(--bg-glass-border)"></div>

      <!-- 搜索按钮 -->
      <button class="glass-btn" onclick="BlogAPI.openSearch()" aria-label="搜索文章">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <span class="hidden lg:inline">搜索</span>
      </button>

      <!-- 设置按钮 -->
      <button class="glass-btn" onclick="window.dispatchEvent(new CustomEvent('opensettings'))" aria-label="设置">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        <span class="hidden lg:inline">设置</span>
      </button>

      <!-- 暗色模式切换 (Vue mount target) -->
      <div id="app-theme"></div>
    </div>

    <!-- 移动端菜单按钮（右侧定位） -->
    <button id="mobile-menu-btn" class="md:hidden glass-btn p-2 absolute right-4" onclick="toggleMobileMenu()" aria-label="菜单">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="menu-icon-open">
        <line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>
      </svg>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="menu-icon-close" class="hidden">
        <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
      </svg>
    </button>
  </div>
</nav>

<!-- 移动端侧边栏 -->
<div id="mobile-menu-overlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[999] hidden opacity-0 transition-opacity duration-300" onclick="toggleMobileMenu()"></div>
<aside id="mobile-sidebar" class="fixed top-0 right-0 h-full w-72 glass-card z-[1000] transform translate-x-full transition-transform duration-300 ease-out p-6 pt-20 overflow-y-auto">
  <div class="flex flex-col gap-1">
    {{#each config.nav}}
    <a href="{{this.url}}" class="glass-btn px-4 py-3 text-base font-medium rounded-lg" style="color: var(--text-primary)" onclick="toggleMobileMenu()">
      {{this.label}}
    </a>
    {{/each}}

    <hr class="my-3 border-t" style="border-color: var(--bg-glass-border)">

    <!-- 搜索入口 -->
    <button class="w-full glass-input flex items-center gap-2 text-left" onclick="BlogAPI.openSearch(); toggleMobileMenu();">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      搜索文章...
    </button>

    <!-- 暗色切换 -->
    <div id="app-theme-mobile" class="mt-2"></div>
  </div>
</aside>
