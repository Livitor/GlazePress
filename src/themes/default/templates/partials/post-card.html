<!--
  文章卡片组件
  用法: 在 each-posts 循环中使用
  特性：毛玻璃卡片 + 封面图 + hover 缩放动画 + 标签 pill + 阅读时长 + 装饰元素

  预期上下文变量 (this):
    - title, url, description, cover, date, tags[], categories[], readingTime
-->

<article class="post-card glass-card overflow-hidden group cursor-pointer animate-fade-in-up stagger-item hover-lift" style="will-change: transform">
  <a href="{{this.url}}" class="block relative">

    <!-- 封面图 -->
    <div class="relative h-48 overflow-hidden bg-gradient-to-br from-violet-500/20 via-purple-500/20 to-pink-500/20">
      {{#if this.cover}}
      <img src="{{this.cover}}"
           alt="{{this.title}}"
           loading="lazy"
           decoding="async"
           class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110 opacity-0"
           onload="this.classList.remove('opacity-0'); this.style.transition='opacity 400ms ease'">
      {{else}}
      <!-- 装饰性默认封面：渐变 + 图标 -->
      <div class="w-full h-full flex items-center justify-center relative">
        <!-- 装饰光斑 -->
        <div class="absolute top-4 right-4 w-16 h-16 rounded-full opacity-20 blur-xl" style="background: var(--color-accent)"></div>
        <div class="absolute bottom-4 left-4 w-12 h-12 rounded-full opacity-15 blur-lg" style="background: var(--color-primary)"></div>
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" class="text-violet-300/60 relative z-10"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
      </div>
      {{/if}}

      <!-- 悬浮遮罩 -->
      <div class="absolute inset-0 bg-gradient-to-t from-black/30 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>

      <!-- 装饰角标 -->
      <div class="absolute top-3 right-3 w-8 h-8 rounded-lg flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all duration-300 transform translate-y-2 group-hover:translate-y-0" style="background: rgba(139,92,246,0.8); backdrop-filter: blur(8px);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </div>
    </div>

    <!-- 卡片内容 -->
    <div class="p-5">
      <!-- 日期与阅读时长 -->
      <div class="flex items-center gap-3 text-xs mb-2.5" style="color: var(--text-tertiary)">
        <time datetime="{{this.date}}">{{this.date}}</time>
        <span>·</span>
        <span>{{this.readingTime}} 分钟阅读</span>
      </div>

      <!-- 标题 -->
      <h3 class="text-lg font-bold font-heading leading-snug mb-2 line-clamp-2 group-hover:text-primary transition-colors duration-200" style="color: var(--text-primary)">
        {{this.title}}
      </h3>

      <!-- 摘要 -->
      <p class="text-sm leading-relaxed mb-3 line-clamp-2" style="color: var(--text-secondary)">
        {{this.description}}
      </p>

      <!-- 标签 & 分类 -->
      <div class="flex flex-wrap gap-1.5">
        {{#if this.categories}}
        {{#each this.categories}}
        <span class="tag-pill tag-pill--amber">{{this}}</span>
        {{/each}}
        {{/if}}
        {{#if this.tags}}
        {{#each this.tags}}
        <span class="tag-pill">{{this}}</span>
        {{/each}}
        {{/if}}
      </div>
    </div>
  </a>
</article>
