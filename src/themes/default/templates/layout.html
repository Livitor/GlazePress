<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <!-- 站点基础信息 -->
  <title>{{config.title}}</title>
  <meta name="description" content="{{config.description}}">
  <meta name="author" content="{{config.author.name}}">
  <link rel="canonical" href="{{config.baseUrl}}">

  <!-- Open Graph / 社交分享 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{config.title}}">
  <meta property="og:description" content="{{config.description}}">
  <meta property="og:image" content="{{config.author.avatar}}">

  <!-- 预连接 CDN 资源（性能优化） -->
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://unpkg.com">

  <!-- Google Fonts: Inter + Noto Sans SC + JetBrains Mono -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- 关键 CSS 内联（首屏渲染必须） -->
  <style>
    /* 极简内联样式：防止 FOUC (Flash of Unstyled Content)
       使用 opacity:0 避免闪烁，JS 加载后切换为 visible */
    body{opacity:0;transition:opacity 0.3s ease}body.loaded{opacity:1}
    .loading-spinner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%)}
    /* 兜底：如果 JS 加载失败或报错，3秒后强制显示页面 */
    @keyframes _gp_show_body{to{opacity:1}}body{animation:_gp_show_body 3s 2s forwards}
  </style>

  <!-- 主题 CSS 文件 -->
  <link rel="stylesheet" href="{{config.baseUrl}}/assets/css/base.css">
  <link rel="stylesheet" href="{{config.baseUrl}}/assets/css/glassmorphism.css">
  <link rel="stylesheet" href="{{config.baseUrl}}/assets/css/animations.css">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌐%3C/text%3E%3C/svg%3E">

  {{#if config.custom.googleAnalytics}}
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id={{config.custom.googleAnalytics}}"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','{{config.custom.googleAnalytics}}');</script>
  {{/if}}
</head>

<body class="antialiased">
  <!-- 兜底：确保页面可见（即使后续 JS 报错，3秒后强制显示） -->
  <script>(function(){setTimeout(function(){document.body.classList.add('loaded')},3000)})()</script>

  <!-- 导航栏（博客页和文章页显示） -->
  {{#unless page_is_landing}}
  {{> navbar}}
  {{/unless}}

  <!-- 主内容区 -->
  <main id="main-content">
    {{{page_content}}}
  </main>

  <!-- 页脚（博客页和文章页显示） -->
  {{#unless page_is_landing}}
  {{> footer}}
  {{/unless}}

  <!-- ========== CDN 依赖（defer 加载不阻塞渲染）========== -->

  <!-- Tailwind CSS 3.4+ (CDN) -->
  <script>
    // 抑制 Tailwind CDN 的生产环境警告（开发/CDN 模式下正常提示）
    (function(){
      const _warn = console.warn;
      console.warn = function(...args) {
        if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
        _warn.apply(console, args);
      };
      window._gp_restoreWarn = function() { console.warn = _warn; };
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Tailwind 自定义配置
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '{{config.theme.primary}}', light: '#818cf8', dark: '#4f46e5' }
          },
          fontFamily: {
            heading: ['{{config.theme.font.heading}}'],
            body: ['{{config.theme.font.body}}'],
            code: ['{{config.theme.font.code}}']
          },
          animation: {
            'fade-in-up': 'fadeInUp 400ms ease-out both',
            'scale-in': 'scaleIn 300ms cubic-bezier(0.34, 1.56, 0.64, 1) both'
          }
        }
      }
    };
  </script>

  <!-- Vue 3.4+ Global Build (CDN) -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js" defer></script>

  <!-- Lucide Icons (CDN) -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>

  <!-- PrismJS 代码高亮 (仅文章页需要) -->
  {{#if page_is_post}}
  <link rel="stylesheet" href="https://unpkg.com/prismjs@1/themes/prism-tomorrow.min.css">
  <script src="https://unpkg.com/prismjs@1/prism.min.js" defer></script>
  <script src="https://unpkg.com/prismjs@1/plugins/autoloader/prism-autoloader.min.js" defer></script>
  {{/if}}

  <!-- GSAP 动画库 (按需加载) -->
  <script src="https://unpkg.com/gsap@3/dist/gsap.min.js" defer></script>

  <!-- ========== 本地脚本 ========== -->

  <!-- 运行时配置 -->
  <script src="{{config.baseUrl}}/assets/js/config.js"></script>

  <!-- 工具函数 -->
  <script src="{{config.baseUrl}}/assets/js/utils.js"></script>

  <!-- BlogAPI 全局对象 -->
  <script src="{{config.baseUrl}}/assets/js/blog-api.js"></script>

  <!-- Vue 应用主入口 -->
  <script src="{{config.baseUrl}}/assets/js/app.js" defer></script>

  <!-- 初始化脚本 -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      document.body.classList.add('loaded');
      // 初始化 Lucide 图标
      if (typeof lucide !== 'undefined') lucide.createIcons();
      // 初始化 Prism 高亮
      if (typeof Prism !== 'undefined') Prism.highlightAll();
    });
  </script>
</body>
</html>
